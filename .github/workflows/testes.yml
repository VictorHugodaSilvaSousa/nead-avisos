# Roda os testes a cada mudança no código (inclusive os de segurança: estado cifrado, registros sem dado
# pessoal, botões só para o Moodle). Não usa nenhum Secret.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q -c constraints.txt . pytest
      - run: python -m pytest -q
      - name: Plugin do Moodle (sintaxe + testes sem Moodle)
        run: |
          php -v | head -1
          find moodle-plugin -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null
          php moodle-plugin/testes-sem-moodle/harness.php
      - name: Instaladores PowerShell (sintaxe; instalar.ps1 sem BOM, que quebraria o 'irm | iex')
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('instalar.ps1')
          if ($bytes[0] -eq 0xEF) { throw 'instalar.ps1 não pode ter BOM: quebra o irm | iex' }
          foreach ($f in 'instalar.ps1', 'scripts/instalar-codigo.ps1') {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$t, [ref]$e)
            if ($e.Count) { throw "$f tem erro de sintaxe: $($e[0].Message)" }
          }
          $s = Get-Content instalar.ps1 -Raw
          $t = $null; $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($s, [ref]$t, [ref]$e)
          if ($e.Count) { throw "instalar.ps1 como texto (irm | iex): $($e[0].Message)" }
          Write-Host 'Instaladores OK'
