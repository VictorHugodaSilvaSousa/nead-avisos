# NEAD Avisos na nuvem (GitHub Actions): funciona com o PC DESLIGADO.
#
# Secrets (Settings > Secrets and variables > Actions > Secrets) — nunca aparecem nos registros:
#   NEAD_AVISOS_MOODLE_TOKEN       chave do app do Moodle (gerada pelo `nead-avisos setup`; NÃO é a senha)
#   NEAD_AVISOS_TELEGRAM_TOKEN     token do seu robô
#   NEAD_AVISOS_TELEGRAM_CHAT_ID   seu chat
#   NEAD_AVISOS_TELEGRAM_GROUP_ID  grupo da turma (opcional, só para o representante)
#   NEAD_AVISOS_CHAVE_ESTADO       chave que criptografa o estado (`nead-avisos chave-nuvem` mostra a sua)
#
# Segurança:
#   - repositório público = registros públicos: o programa nunca escreve nomes, títulos ou textos nos registros;
#   - o estado fica no cache do Actions CRIPTOGRAFADO (sem a chave, ninguém lê);
#   - ações do GitHub fixadas por SHA e dependências Python com versões exatas (constraints.txt);
#   - o token do GitHub desta execução só pode ler o código e mexer no próprio Actions.
name: NEAD Avisos

on:
  schedule:
    # Reserva: na prática o GitHub roda isto só a cada 3–7 h. O disparo principal (a cada 15 min) vem do
    # cron-job.org chamando workflow_dispatch com um token que só pode disparar este workflow.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}           # cron-job.org (a cada 15 min) e botão "Run workflow"

permissions:
  contents: read
  actions: write          # reativar o agendamento e apagar estados antigos do cache

concurrency:
  group: nead-avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q -c constraints.txt .
      - name: Conferir configuração
        env:
          HAS_KEY: ${{ secrets.NEAD_AVISOS_CHAVE_ESTADO != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Falta o Secret NEAD_AVISOS_CHAVE_ESTADO: o estado fica sem criptografia. Rode 'nead-avisos chave-nuvem' no PC e cadastre o valor."
          fi
      - name: Restaurar estado
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: nead-avisos-state-${{ github.run_id }}
          restore-keys: nead-avisos-state-
      - name: Verificar Moodle e avisar
        env:
          NEAD_AVISOS_MOODLE_TOKEN: ${{ secrets.NEAD_AVISOS_MOODLE_TOKEN }}
          NEAD_AVISOS_TELEGRAM_TOKEN: ${{ secrets.NEAD_AVISOS_TELEGRAM_TOKEN }}
          NEAD_AVISOS_CHAVE_ESTADO: ${{ secrets.NEAD_AVISOS_CHAVE_ESTADO }}
          # Secrets primeiro (ficam ocultos nos registros); Variables só para quem configurou na versão antiga.
          NEAD_AVISOS_TELEGRAM_CHAT_ID: ${{ secrets.NEAD_AVISOS_TELEGRAM_CHAT_ID || vars.NEAD_AVISOS_TELEGRAM_CHAT_ID }}
          NEAD_AVISOS_TELEGRAM_GROUP_ID: ${{ secrets.NEAD_AVISOS_TELEGRAM_GROUP_ID || vars.NEAD_AVISOS_TELEGRAM_GROUP_ID }}
          NEAD_AVISOS_DATA_DIR: data
          NEAD_AVISOS_PRIMEIRA_EXECUCAO_SILENCIOSA: "1"
        run: nead-avisos run
      - name: Salvar estado
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: nead-avisos-state-${{ github.run_id }}
      - name: Manter agendamento ativo
        # O GitHub desliga workflows agendados de repositórios públicos após 60 dias sem alterações.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable" || true
      - name: Apagar estados antigos
        # Cada execução guarda um estado novo; só os 3 mais recentes interessam (96 execuções/dia).
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/caches?key=nead-avisos-state-&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[3:][].id' | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true
            done
