[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nead-avisos"
version = "0.1.0"
description = "Avisos do Moodle do NEAD/IFB no Telegram (somente leitura)"
requires-python = ">=3.11"
dependencies = ["truststore>=0.9", "tzdata>=2024.1", "keyring>=25; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nead-avisos = "nead_avisos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
